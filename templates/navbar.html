<header class="sticky top-0 z-40 border-b border-white/60 bg-white/82 backdrop-blur">
    <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-4 sm:px-6 lg:flex-row lg:items-center lg:justify-between lg:px-8">
        <a href="{% url 'home:index' %}" class="flex items-center gap-4">
            <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gov.deep text-sm font-extrabold uppercase tracking-[0.22em] text-white">
                DE
            </div>
            <div>
                <p class="text-xs font-bold uppercase tracking-[0.26em] text-gov.green">Departamento de Computacao</p>
                <h1 class="text-lg font-extrabold text-gov.deep">Portal DECOM</h1>
            </div>
        </a>

        <div class="flex flex-col gap-3 lg:items-end">
            <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold text-slate-700">
                <a href="{% url 'home:index' %}" class="rounded-full px-4 py-2 transition hover:bg-gov.sand hover:text-gov.deep">Inicio</a>
                <a href="{% url 'home:index' %}#servicos" class="rounded-full px-4 py-2 transition hover:bg-gov.sand hover:text-gov.deep">Conteudo</a>
                <a href="{% url 'home:index' %}#contato" class="rounded-full px-4 py-2 transition hover:bg-gov.sand hover:text-gov.deep">Contato</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:dashboard' %}" class="rounded-full px-4 py-2 transition hover:bg-gov.sand hover:text-gov.deep">Painel</a>
                    {% if user.is_staff %}
                        <a href="{% url 'accounts:invitation_panel' %}" class="rounded-full px-4 py-2 transition hover:bg-gov.sand hover:text-gov.deep">Convites</a>
                    {% endif %}
                    <form action="{% url 'accounts:logout' %}" method="post" class="inline-flex">
                        {% csrf_token %}
                        <button type="submit" class="btn-secondary px-4 py-2">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login_request' %}" class="btn-primary px-4 py-2">
                        Login
                    </a>
                {% endif %}
            </nav>
        </div>
    </div>
</header>
