<header class="br-header" id="header" data-sticky="data-sticky">
    <div class="container-lg">
        <div class="header-top">
            <div class="header-logo">
                <img src="https://www.decom.ufvjm.edu.br/dc2020/wp-content/uploads/2020/03/logo_topo.png"
                     alt="Portal DECOM" />
                <span class="br-divider vertical"></span>
                <div class="header-sign">Portal DECOM</div>
            </div>

            <div class="header-actions">
                <div class="header-links dropdown">
                    <button class="br-button circle small" type="button"
                            data-toggle="dropdown"
                            aria-label="Abrir acesso rapido"
                            aria-expanded="false"
                            aria-controls="header-quick-links">
                        <i class="fas fa-ellipsis-v" aria-hidden="true"></i>
                    </button>
                    <div id="header-quick-links" class="br-list">
                        <div class="header">
                            <div class="title">Acesso rapido</div>
                        </div>
                        <a class="br-item" href="{% url 'home:index' %}">
                            <div class="content">Inicio</div>
                        </a>
                        <a class="br-item" href="{% url 'home:index' %}#servicos">
                            <div class="content">Conteudo</div>
                        </a>
                        <a class="br-item" href="{% url 'home:index' %}#contato">
                            <div class="content">Contato</div>
                        </a>
                    </div>
                </div>

                <span class="br-divider vertical mx-half mx-sm-1"></span>

                <div class="header-login">
                    <div class="header-sign-in">
                        {% if user.is_authenticated %}
                            <div class="dropdown">
                                <button class="br-sign-in small" type="button"
                                        data-toggle="dropdown"
                                        aria-label="Abrir menu da conta"
                                        aria-expanded="false"
                                        aria-controls="header-account-menu">
                                    <i class="fas fa-user" aria-hidden="true"></i>
                                    <span class="d-sm-inline">
                                        {{ user.get_full_name|default:user.email|truncatechars:20 }}
                                    </span>
                                </button>
                                <div id="header-account-menu" class="br-list">
                                    <div class="header">
                                        <div class="title">Minha conta</div>
                                    </div>
                                    <a class="br-item" href="{% url 'accounts:dashboard' %}">
                                        <div class="content">Painel</div>
                                    </a>
                                    {% if user.is_staff %}
                                        <a class="br-item" href="{% url 'accounts:invitation_panel' %}">
                                            <div class="content">Pessoas do sistema</div>
                                        </a>
                                    {% endif %}
                                    <span class="br-divider"></span>
                                    <div class="br-item">
                                        <form action="{% url 'accounts:logout' %}" method="post">
                                            {% csrf_token %}
                                            <button type="submit" class="br-button secondary small block">
                                                <i class="fas fa-sign-out-alt mr-1" aria-hidden="true"></i>
                                                Sair
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        {% else %}
                            <a href="{% url 'accounts:login_request' %}" class="br-sign-in small">
                                <i class="fas fa-user" aria-hidden="true"></i>
                                <span class="d-sm-inline">Entrar</span>
                            </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>

        <div class="header-bottom">
            <div class="header-menu">
                <div class="header-info">
                    <div class="header-title">Departamento de Computacao</div>
                    <div class="header-subtitle">Portal institucional</div>
                </div>
            </div>
        </div>
    </div>
</header>
