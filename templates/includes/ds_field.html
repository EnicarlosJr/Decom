<div class="{% if kind == 'textarea' %}br-textarea{% elif kind == 'select' %}br-select{% else %}br-input{% endif %}{% if field.errors %} danger{% endif %}{% if wrapper_class %} {{ wrapper_class }}{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if not field.field.required %}
            <span class="text-weight-regular text-secondary-01">(opcional)</span>
        {% endif %}
    </label>
    {% if field.help_text %}
        <span class="help d-block mb-2">{{ field.help_text }}</span>
    {% endif %}
    {{ field }}
    {% if field.errors %}
        <span class="feedback danger" role="alert">
            <i class="fas fa-times-circle" aria-hidden="true"></i>
            {{ field.errors.0 }}
        </span>
    {% endif %}
</div>
